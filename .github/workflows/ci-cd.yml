name: CI/CD Pipeline

# Lance la CI sur les branches de travail et les branches partagées.
on:
  push:
    branches:
      - dev
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # Vérifie que les Pull Requests respectent le Git flow défini.
  pull-request-policy:
    name: Validate pull request source
    runs-on: ubuntu-latest

    steps:
      - name: Enforce documented branch flow
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Événement hors Pull Request : aucun contrôle de branche source nécessaire."
            exit 0
          fi

          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Une Pull Request vers main doit obligatoirement provenir de dev."
            exit 1
          fi

          if [[ "$BASE_REF" == "dev" && "$HEAD_REF" != feature/* && "$HEAD_REF" != fix/* ]]; then
            echo "Une Pull Request vers dev doit provenir d'une branche feature/* ou fix/*."
            exit 1
          fi

          echo "Flux de branches valide : $HEAD_REF vers $BASE_REF."

  # Exécute les contrôles rapides à chaque modification.
  quick-checks:
    name: Quick CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate current repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f compose.ci.yml
          test -f compose.prod.yml
          test -f landing-page/Dockerfile
          test -f landing-page/index.html

      - name: Detect Next.js application
        id: app
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Application Next.js non initialisée : les contrôles npm ne sont pas encore applicables."
          fi

      - name: Setup Node.js
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Require essential npm scripts
        if: steps.app.outputs.exists == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const scripts = require('./package.json').scripts ?? {};
          const required = ['lint', 'typecheck', 'test:unit', 'build'];
          const missing = required.filter((name) => !scripts[name]);
          if (missing.length) {
            throw new Error('Scripts npm manquants : ' + missing.join(', '));
          }
          NODE

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.app.outputs.exists == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.app.outputs.exists == 'true'
        run: npm run test:unit

      - name: Build Next.js
        if: steps.app.outputs.exists == 'true'
        # Better Auth exige un secret pendant l'analyse des routes au build.
        env:
          BETTER_AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
          # L'URL locale est factice et utilisée uniquement pendant le build.
          BETTER_AUTH_URL: http://localhost:3000
        run: npm run build

  # Exécute les tests d'intégration avec services éphémères avant ou après une fusion dans dev.
  integration-checks:
    name: Integration CI (PostgreSQL & Redis)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'pull_request'
    needs:
      - pull-request-policy
      - quick-checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: heig_odyssey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/heig_odyssey_test?schema=public"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Next.js application
        id: app
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Application Next.js non initialisée : les tests d'intégration ne sont pas encore applicables."
          fi

      - name: Setup Node.js
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Apply Prisma Migrations to Ephemeral Database
        if: steps.app.outputs.exists == 'true'
        run: npx prisma migrate deploy

      - name: Run Combat and Integration Tests
        if: steps.app.outputs.exists == 'true'
        run: |
          npm run test:combat
          npm run test:integration

      - name: Validate Docker Compose Configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f compose.yaml || -f compose.yml || -f docker-compose.yaml || -f docker-compose.yml ]]; then
            # Vérifie la structure sans exiger les secrets de production.
            docker compose config --no-interpolate
            docker compose config --variables
          else
            echo "Docker Compose n'est pas encore versionné ; contrôle différé à T-US18-02."
          fi

  # Exécute les contrôles complets pour une release de dev vers main.
  release-validation:
    name: Full release validation
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs:
      - pull-request-policy
      - quick-checks
      - integration-checks
    runs-on: ubuntu-latest

    # Le parcours Playwright utilise une base isolée, créée uniquement pour ce job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: heig_odyssey_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/heig_odyssey_e2e?schema=public"
      REDIS_URL: "redis://localhost:6379"
      BETTER_AUTH_SECRET: "e2e-only-auth-secret-at-least-32-characters"
      BETTER_AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      # Les comptes E2E sont injectés en base : ces valeurs ne servent jamais à envoyer.
      RESEND_API_KEY: "re_e2e_placeholder"
      RESEND_FROM_EMAIL: "HEIG Odyssey <noreply@heig-odyssey.online>"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Next.js application
        id: app
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Application Next.js non initialisée : les contrôles navigateur ne sont pas encore applicables."
          fi

      - name: Setup Node.js
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Apply Prisma migrations to E2E database
        if: steps.app.outputs.exists == 'true'
        run: npx prisma migrate deploy

      - name: Install Chromium for Playwright
        if: steps.app.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Pull Request browser checks
        if: steps.app.outputs.exists == 'true'
        shell: bash
        run: |
          npm run test:e2e -- --project=chromium
          npm run test:a11y --if-present

      - name: Validate Docker Compose when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f compose.yaml || -f compose.yml || -f docker-compose.yaml || -f docker-compose.yml ]]; then
            # Vérifie la structure sans exiger les secrets de production.
            docker compose config --no-interpolate
            docker compose config --variables
          else
            echo "Docker Compose n'est pas encore versionné ; contrôle différé à T-US18-02."
          fi

          # Valide également les substitutions sans utiliser de secret réel.
          export APP_IMAGE=heig-odyssey-validation:"$GITHUB_SHA"
          export MIGRATION_IMAGE=heig-odyssey-migrate-validation:"$GITHUB_SHA"
          export LANDING_IMAGE=heig-odyssey-landing-validation:"$GITHUB_SHA"
          export POSTGRES_PASSWORD=release-validation-postgres-password
          export BETTER_AUTH_SECRET=release-validation-auth-secret-at-least-32-characters
          export BETTER_AUTH_URL=http://localhost:3000
          export NEXT_PUBLIC_APP_URL=http://localhost:3000
          export RESEND_API_KEY=re_release_validation
          export RESEND_FROM_EMAIL="HEIG Odyssey <noreply@heig-odyssey.online>"

          docker compose -f compose.ci.yml config >/dev/null
          docker compose -f compose.prod.yml config >/dev/null

      - name: Build validation images
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag heig-odyssey-validation:"$GITHUB_SHA" .
          docker build --target migrator --tag heig-odyssey-migrate-validation:"$GITHUB_SHA" .
          docker build --tag heig-odyssey-landing-validation:"$GITHUB_SHA" ./landing-page

          # Confirme que l'image dédiée contient bien le client de migration Prisma.
          docker run --rm heig-odyssey-migrate-validation:"$GITHUB_SHA" --version

      - name: Smoke test landing image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name landing-ci -p 8080:80 heig-odyssey-landing-validation:"$GITHUB_SHA"
          trap 'docker rm -f landing-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs landing-ci
          exit 1

  # Construit, teste et publie les images identifiées par le SHA Git.
  package:
    name: Test and publish SHA images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define immutable image names
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME_LOWER="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "APP_IMAGE=${REGISTRY}/${IMAGE_NAME_LOWER}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "MIGRATION_IMAGE=${REGISTRY}/${IMAGE_NAME_LOWER}-migrate:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "LANDING_IMAGE=${REGISTRY}/${IMAGE_NAME_LOWER}-landing:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build production images once
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "$APP_IMAGE" .
          docker build --target migrator --tag "$MIGRATION_IMAGE" .
          docker build --tag "$LANDING_IMAGE" ./landing-page

      - name: Test exact production images
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -f compose.ci.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          export APP_IMAGE MIGRATION_IMAGE LANDING_IMAGE
          docker compose -f compose.ci.yml config

          # Applique le schéma avec l'image qui sera réellement publiée.
          docker compose -f compose.ci.yml run --rm migrate
          docker compose -f compose.ci.yml up -d --wait app landing

          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://localhost:3000/api/health >/dev/null \
              && curl --fail --silent --show-error http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f compose.ci.yml logs 2>/dev/null || true
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          docker push "$APP_IMAGE"
          docker push "$MIGRATION_IMAGE"
          docker push "$LANDING_IMAGE"

  # Déploie sur le VPS uniquement après une fusion réussie dans main.
  deploy:
    name: Deploy exact SHA to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    # Empêche deux déploiements de modifier le VPS en même temps.
    concurrency:
      group: production-vps
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Le VPS reçoit toujours le Compose appartenant au même SHA que les images.
      - name: Copy production Compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: compose.prod.yml
          target: /home/app/heig-odyssey
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ github.repository }}
          GHCR_USERNAME: ${{ github.actor }}
          CR_PAT: ${{ secrets.CR_PAT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          envs: DEPLOY_SHA,IMAGE_NAME,GHCR_USERNAME,CR_PAT,BETTER_AUTH_SECRET,BETTER_AUTH_URL,NEXT_PUBLIC_APP_URL,RESEND_API_KEY,RESEND_FROM_EMAIL,POSTGRES_PASSWORD
          script: |
            set -euo pipefail
            cd /home/app/heig-odyssey

            IMAGE_NAME_LOWER="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
            PREVIOUS_SHA="$(cat .deployed_sha 2>/dev/null || true)"

            configure_images() {
              local tag="$1"
              export APP_IMAGE="ghcr.io/${IMAGE_NAME_LOWER}:${tag}"
              export MIGRATION_IMAGE="ghcr.io/${IMAGE_NAME_LOWER}-migrate:${tag}"
              export LANDING_IMAGE="ghcr.io/${IMAGE_NAME_LOWER}-landing:${tag}"
            }

            dc() {
              docker compose -f compose.prod.yml "$@"
            }

            smoke_test() {
              local public_app_url="${BETTER_AUTH_URL%/}/api/health"

              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error http://localhost:3000/api/health >/dev/null \
                  && curl --fail --silent --show-error http://localhost:8080/health >/dev/null \
                  && curl --fail --silent --show-error "$public_app_url" >/dev/null \
                  && curl --fail --silent --show-error https://heig-odyssey.online/health >/dev/null; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            restore_previous() {
              if [[ -z "$PREVIOUS_SHA" ]]; then
                echo "Aucun SHA précédent connu : rollback impossible."
                return 1
              fi

              configure_images "$PREVIOUS_SHA"
              dc pull webapp landing-page || return 1
              # Les migrations ne sont pas annulées automatiquement : elles doivent
              # rester compatibles avec la version applicative précédente.
              dc up -d --remove-orphans traefik webapp landing-page postgres redis || return 1
              smoke_test
            }

            echo "$CR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            configure_images "$DEPLOY_SHA"
            dc config >/dev/null
            dc --profile tools pull webapp landing-page migrate

            # Le volume existant est conservé. Cette commande remplace seulement
            # l'ancien mot de passe local par le secret de production actuel.
            dc up -d --wait postgres redis
            dc exec -T postgres sh -ec \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=ON_ERROR_STOP=on --set="new_password=$POSTGRES_PASSWORD"' <<'SQL'
            ALTER ROLE postgres WITH PASSWORD :'new_password';
            SQL

            # L'image de migration possède Prisma, contrairement à l'image web minimale.
            if ! dc --profile tools run --rm migrate; then
              echo "La migration de la base de données a échoué."
              if restore_previous; then
                echo "Version ${PREVIOUS_SHA} restaurée."
              else
                echo "La restauration de ${PREVIOUS_SHA:-la version précédente} a échoué."
              fi
              exit 1
            fi

            if ! dc up -d --remove-orphans traefik webapp landing-page postgres redis; then
              echo "Le démarrage de ${DEPLOY_SHA} a échoué."
              if restore_previous; then
                echo "Version ${PREVIOUS_SHA} restaurée."
              else
                echo "La restauration de ${PREVIOUS_SHA:-la version précédente} a échoué."
              fi
              exit 1
            fi

            if smoke_test; then
              printf '%s\n' "$DEPLOY_SHA" > .deployed_sha
              exit 0
            fi

            echo "Le smoke test a échoué pour ${DEPLOY_SHA}."

            if restore_previous; then
              echo "Version ${PREVIOUS_SHA} restaurée."
              exit 1
            fi

            echo "Le rollback vers ${PREVIOUS_SHA} a également échoué."
            exit 1
