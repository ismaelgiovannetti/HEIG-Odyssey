name: CI/CD Pipeline POC

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Force le nom d'image en minuscules pour la compatibilité GHCR
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Vérification basique (sur dev, main et PR)
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dummy Lint & Test
        run: |
          echo "Exécution des tests et linters..."
          echo "Tous les tests sont passés !"

  # 2. Build et Push GHCR (uniquement au push sur main)
  build-and-push:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. Déploiement SSH sur VPS Hostinger (uniquement après le build sur main)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Convert image name to lowercase
        run: echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            cd /home/app/heig-odyssey
            
            # Auth GHCR pour autoriser le pull de packages privés
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Mise à jour et redémarrage
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Smoke test
            sleep 4
            curl -f http://localhost:3000/health || exit 1
