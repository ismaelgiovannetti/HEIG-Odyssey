# Valide ensemble les quatre images exactes qui seront publiées dans GHCR.
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/heig_odyssey_ci?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ci-secret-for-testing-only-min-32-chars-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Ces valeurs ne servent qu'au démarrage du conteneur pendant le smoke test.
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: HEIG Odyssey <noreply@heig-odyssey.online>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heig-odyssey-ci-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    init: true
    stop_grace_period: 10s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/heig_odyssey_ci?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heig-odyssey-ci-network
    healthcheck:
      test: ["CMD", "node", "scripts/ops/worker-healthcheck.mjs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  landing:
    image: ${LANDING_IMAGE:?LANDING_IMAGE is required}
    ports:
      - "8080:80"
    networks:
      - heig-odyssey-ci-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Ce service ponctuel applique les migrations avec l'image dédiée testée.
  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/heig_odyssey_ci?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - heig-odyssey-ci-network

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heig_odyssey_ci
    networks:
      - heig-odyssey-ci-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heig_odyssey_ci"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    networks:
      - heig-odyssey-ci-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

networks:
  heig-odyssey-ci-network:
    driver: bridge
