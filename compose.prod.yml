# Déploiement VPS : seules les images immuables publiées par la CI sont utilisées.
services:
  webapp:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: webapp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Accès local de diagnostic ; l'accès public passe uniquement par Traefik.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/heig_odyssey?schema=public
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_app-network"
      - "traefik.http.routers.heig-odyssey-app.rule=Host(`play.heig-odyssey.online`)"
      - "traefik.http.routers.heig-odyssey-app.entrypoints=websecure"
      - "traefik.http.routers.heig-odyssey-app.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.heig-odyssey-app.loadbalancer.server.port=3000"
      - "traefik.http.routers.heig-odyssey-app-web.rule=Host(`play.heig-odyssey.online`)"
      - "traefik.http.routers.heig-odyssey-app-web.entrypoints=web"
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    container_name: heig-odyssey-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/heig_odyssey?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "scripts/ops/worker-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  landing-page:
    image: ${LANDING_IMAGE:?LANDING_IMAGE is required}
    container_name: landing-page
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_app-network"
      - "traefik.http.routers.heig-odyssey-landing.rule=Host(`heig-odyssey.online`) || Host(`www.heig-odyssey.online`)"
      - "traefik.http.routers.heig-odyssey-landing.entrypoints=websecure"
      - "traefik.http.routers.heig-odyssey-landing.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.heig-odyssey-landing.loadbalancer.server.port=80"
      - "traefik.http.routers.heig-odyssey-landing-web.rule=Host(`heig-odyssey.online`) || Host(`www.heig-odyssey.online`)"
      - "traefik.http.routers.heig-odyssey-landing-web.entrypoints=web"
    networks:
      - frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Les migrations s'exécutent une seule fois avant le redémarrage applicatif.
  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/heig_odyssey?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: heig-odyssey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: heig_odyssey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heig_odyssey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: heig-odyssey-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  # Raccordement au Traefik mutualisé sur le VPS
  frontend:
    external: true
    name: root_app-network
  # PostgreSQL et Redis n'ont aucun accès direct à l'extérieur du réseau Docker.
  backend:
    name: heig-odyssey-backend
    driver: bridge
    internal: true
