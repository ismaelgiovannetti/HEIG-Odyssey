<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Outer Black Border -->
  <rect x="5" y="0" width="6" height="1" fill="#000000"/>
  <rect x="3" y="1" width="2" height="1" fill="#000000"/>
  <rect x="11" y="1" width="2" height="1" fill="#000000"/>
  <rect x="2" y="2" width="1" height="1" fill="#000000"/>
  <rect x="13" y="2" width="1" height="1" fill="#000000"/>
  <rect x="1" y="3" width="1" height="2" fill="#000000"/>
  <rect x="14" y="3" width="1" height="2" fill="#000000"/>
  <rect x="0" y="5" width="1" height="6" fill="#000000"/>
  <rect x="15" y="5" width="1" height="6" fill="#000000"/>
  <rect x="1" y="11" width="1" height="2" fill="#000000"/>
  <rect x="14" y="11" width="1" height="2" fill="#000000"/>
  <rect x="2" y="13" width="1" height="1" fill="#000000"/>
  <rect x="13" y="13" width="1" height="1" fill="#000000"/>
  <rect x="3" y="14" width="2" height="1" fill="#000000"/>
  <rect x="11" y="14" width="2" height="1" fill="#000000"/>
  <rect x="5" y="15" width="6" height="1" fill="#000000"/>

  <!-- Top Red Fill -->
  <rect x="5" y="1" width="6" height="1" fill="#C8102E"/>
  <rect x="3" y="2" width="10" height="1" fill="#C8102E"/>
  <rect x="2" y="3" width="12" height="2" fill="#C8102E"/>
  <rect x="1" y="5" width="14" height="2" fill="#C8102E"/>

  <!-- White/Light Highlight (Pixel shine) -->
  <rect x="3" y="2" width="3" height="1" fill="#FF5C5C"/>
  <rect x="2" y="3" width="2" height="1" fill="#FF5C5C"/>

  <!-- Bottom White Fill -->
  <rect x="1" y="9" width="14" height="2" fill="#E7E7EA"/>
  <rect x="2" y="11" width="12" height="2" fill="#E7E7EA"/>
  <rect x="3" y="13" width="10" height="1" fill="#E7E7EA"/>
  <rect x="5" y="14" width="6" height="1" fill="#E7E7EA"/>

  <!-- Middle Black Band -->
  <rect x="0" y="7" width="16" height="2" fill="#000000"/>

  <!-- Button Black Ring -->
  <rect x="6" y="5" width="4" height="6" fill="#000000"/>
  <rect x="5" y="6" width="6" height="4" fill="#000000"/>

  <!-- Button White Center -->
  <rect x="6" y="6" width="4" height="4" fill="#FFFFFF"/>
  <rect x="7" y="7" width="2" height="2" fill="#E7E7EA"/>
</svg>
